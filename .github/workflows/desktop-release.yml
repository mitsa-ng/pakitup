name: Desktop release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_version:
        description: Version to preflight, without the leading v
        required: true
        default: "0.1.0"
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-version:
    name: Verify release version
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.release_version) || github.ref_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Require a release tag at the default branch head
        if: github.event_name == 'push'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin "$DEFAULT_BRANCH"
          default_branch_sha=$(git rev-parse FETCH_HEAD)
          if [[ "$GITHUB_SHA" != "$default_branch_sha" ]]; then
            echo "release tag must point at the current $DEFAULT_BRANCH head" >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Match tag and application versions
        run: >-
          node docs/release/verify-version.mjs
          "$RELEASE_TAG"
          apps/web/src-tauri/Cargo.toml
          apps/web/src-tauri/tauri.conf.json

  verify:
    name: Verify release gate
    needs: verify-version
    runs-on: ubuntu-latest
    env:
      VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Use stable Rust
        run: rustup default stable

      - name: Validate production API URL
        run: node docs/release/validate-production-api-url.mjs

      - name: Enable pnpm
        run: corepack enable

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Run production API URL validator fixtures
        run: pnpm release:validate-api-url

      - name: Run workspace verification
        run: pnpm verify

      - name: Run Rust lint gate
        run: >-
          cargo clippy --manifest-path apps/web/src-tauri/Cargo.toml
          --locked --all-targets -- -D warnings

  build:
    name: Build ${{ matrix.platform }}
    needs: [verify-version, verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-22.04
            bundles: deb,appimage
            rust_target: ""
            target_args: ""
            bundle_dir: apps/web/src-tauri/target/release/bundle
          - platform: macos-aarch64
            os: macos-latest
            bundles: dmg
            rust_target: aarch64-apple-darwin
            target_args: --target aarch64-apple-darwin
            bundle_dir: apps/web/src-tauri/target/aarch64-apple-darwin/release/bundle
          - platform: macos-x86_64
            os: macos-15-intel
            bundles: dmg
            rust_target: x86_64-apple-darwin
            target_args: --target x86_64-apple-darwin
            bundle_dir: apps/web/src-tauri/target/x86_64-apple-darwin/release/bundle
          - platform: windows-x86_64
            os: windows-latest
            bundles: nsis,msi
            rust_target: ""
            target_args: ""
            bundle_dir: apps/web/src-tauri/target/release/bundle
    runs-on: ${{ matrix.os }}
    env:
      VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: startsWith(matrix.platform, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate production API URL and create exact CSP config
        run: >-
          node docs/release/validate-production-api-url.mjs
          --config apps/web/src-tauri/tauri.release.conf.json

      - name: Enable pnpm
        run: corepack enable

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Use stable Rust
        run: rustup default stable

      - name: Install Rust target
        if: matrix.rust_target != ''
        run: rustup target add ${{ matrix.rust_target }}

      - name: Run Rust tests
        working-directory: apps/web/src-tauri
        run: cargo test --locked --all-targets

      - name: Build Tauri bundles
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        with:
          projectPath: apps/web
          args: ${{ matrix.target_args }} --config src-tauri/tauri.release.conf.json --bundles ${{ matrix.bundles }}

      - name: Smoke-test Linux installers on the clean runner
        if: matrix.platform == 'linux-x86_64'
        shell: bash
        run: |
          set -euo pipefail
          deb="$(find '${{ matrix.bundle_dir }}/deb' -maxdepth 1 -type f -name '*.deb' -print -quit)"
          appimage="$(find '${{ matrix.bundle_dir }}/appimage' -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$deb"
          test -n "$appimage"
          deb="$(realpath "$deb")"
          appimage="$(realpath "$appimage")"

          package_name="$(dpkg-deb -f "$deb" Package)"
          sudo apt-get install --no-install-recommends -y "$deb"
          dpkg-query -W -f='${Status}\n' "$package_name" | grep -qx 'install ok installed'
          mapfile -t installed_executables < <(
            dpkg-query -L "$package_name" | while IFS= read -r path; do
              if [[ -f "$path" && -x "$path" ]]; then
                printf '%s\n' "$path"
              fi
            done
          )
          test "${#installed_executables[@]}" -gt 0
          sudo apt-get remove -y "$package_name"

          extract_dir="$(mktemp -d "$RUNNER_TEMP/pakitup-appimage.XXXXXX")"
          (
            cd "$extract_dir"
            "$appimage" --appimage-extract >/dev/null
          )
          test -x "$extract_dir/squashfs-root/AppRun"

      - name: Smoke-test macOS installer on the clean runner
        if: startsWith(matrix.platform, 'macos-')
        shell: bash
        run: |
          set -euo pipefail
          dmg="$(find '${{ matrix.bundle_dir }}/dmg' -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$dmg"
          mount_dir="$RUNNER_TEMP/pakitup-dmg-${{ matrix.platform }}"
          install_dir="$RUNNER_TEMP/pakitup-installed-${{ matrix.platform }}"
          mkdir -p "$mount_dir" "$install_dir"
          attached=0
          cleanup() {
            if [[ "$attached" == 1 ]]; then
              hdiutil detach "$mount_dir"
            fi
          }
          trap cleanup EXIT

          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mount_dir"
          attached=1
          app="$(find "$mount_dir" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app"
          ditto "$app" "$install_dir/Pakitup.app"
          test -f "$install_dir/Pakitup.app/Contents/Info.plist"
          executable="$install_dir/Pakitup.app/Contents/MacOS/Pakitup"
          test -x "$executable"
          plutil -lint "$install_dir/Pakitup.app/Contents/Info.plist"
          if [[ '${{ matrix.platform }}' == 'macos-aarch64' ]]; then
            file "$executable" | grep -q 'arm64'
          else
            file "$executable" | grep -q 'x86_64'
          fi
          hdiutil detach "$mount_dir"
          attached=0

      - name: Smoke-test Windows installers on the clean runner
        if: matrix.platform == 'windows-x86_64'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $nsis = Get-ChildItem '${{ matrix.bundle_dir }}/nsis' -Filter '*-setup.exe' | Select-Object -First 1
          $msi = Get-ChildItem '${{ matrix.bundle_dir }}/msi' -Filter '*.msi' | Select-Object -First 1
          if (-not $nsis -or -not $msi) {
            throw "Expected NSIS and MSI installers"
          }

          $uninstallPaths = @(
            'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*',
            'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*',
            'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
          )
          function Get-PakitupUninstallEntry {
            Get-ItemProperty $uninstallPaths -ErrorAction SilentlyContinue |
              Where-Object { $_.DisplayName -like 'Pakitup*' } |
              Select-Object -First 1
          }
          function Assert-PakitupInstalled {
            $entry = Get-PakitupUninstallEntry
            if (-not $entry) {
              throw "Pakitup uninstall registration was not created"
            }
            $candidates = @()
            if ($entry.InstallLocation) {
              $candidates += Get-ChildItem $entry.InstallLocation -Filter 'Pakitup.exe' -File -Recurse -ErrorAction SilentlyContinue
            }
            if ($entry.DisplayIcon) {
              $displayIcon = $entry.DisplayIcon.Trim('"') -replace ',\d+$', ''
              if (Test-Path $displayIcon -PathType Leaf) {
                $candidates += Get-Item $displayIcon
              }
            }
            if ($candidates.Count -eq 0) {
              throw "Installed Pakitup executable was not found"
            }
            return [PSCustomObject]@{
              Entry = $entry
              Executables = @($candidates.FullName)
            }
          }
          function Assert-InstallerExitCode($process) {
            if ($process.ExitCode -notin @(0, 3010)) {
              throw "Installer exited with code $($process.ExitCode)"
            }
          }
          function Assert-PakitupRemoved($state) {
            if (Get-PakitupUninstallEntry) {
              throw "Pakitup uninstall registration remains"
            }
            foreach ($executable in $state.Executables) {
              if (Test-Path $executable -PathType Leaf) {
                throw "Pakitup executable remains after uninstall: $executable"
              }
            }
          }

          if (Get-PakitupUninstallEntry) {
            throw "Runner was not clean before installer smoke test"
          }

          $nsisInstall = Start-Process -FilePath $nsis.FullName -ArgumentList '/S', '/NS' -Wait -PassThru
          Assert-InstallerExitCode $nsisInstall
          $nsisState = Assert-PakitupInstalled
          $nsisUninstaller = Get-ChildItem $nsisState.Entry.InstallLocation -Filter 'uninstall.exe' -File -Recurse | Select-Object -First 1
          if (-not $nsisUninstaller) {
            throw "NSIS uninstaller was not found"
          }
          $nsisRemove = Start-Process -FilePath $nsisUninstaller.FullName -ArgumentList '/S' -Wait -PassThru
          Assert-InstallerExitCode $nsisRemove
          Assert-PakitupRemoved $nsisState

          $msiInstall = Start-Process -FilePath 'msiexec.exe' -ArgumentList "/i `"$($msi.FullName)`" /quiet /norestart" -Wait -PassThru
          Assert-InstallerExitCode $msiInstall
          $msiState = Assert-PakitupInstalled
          $msiRemove = Start-Process -FilePath 'msiexec.exe' -ArgumentList "/x `"$($msi.FullName)`" /quiet /norestart" -Wait -PassThru
          Assert-InstallerExitCode $msiRemove
          Assert-PakitupRemoved $msiState

      - name: Stage bundles and checksums
        run: >-
          node docs/release/generate-checksums.mjs
          ${{ matrix.bundle_dir }}
          release-assets
          ${{ matrix.platform }}

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-desktop-bundles
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  validate-assets:
    name: Validate complete release asset set
    needs: build
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.release_version) || github.ref_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download all desktop bundles
        uses: actions/download-artifact@v4
        with:
          pattern: "*-desktop-bundles"
          path: release-assets
          merge-multiple: true

      - name: Validate exact release asset allowlist
        run: >-
          node docs/release/validate-release-assets.mjs
          release-assets
          "$RELEASE_TAG"

  draft-release:
    name: Create draft release
    needs: validate-assets
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download all desktop bundles
        uses: actions/download-artifact@v4
        with:
          pattern: "*-desktop-bundles"
          path: release-assets
          merge-multiple: true

      - name: Validate exact release asset allowlist
        run: >-
          node docs/release/validate-release-assets.mjs
          release-assets
          "$RELEASE_TAG"

      - name: Create or update draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mapfile -d '' assets < <(find release-assets -type f -print0)
          test "${#assets[@]}" -gt 0
          declare -A current_assets=()
          for asset in "${assets[@]}"; do
            asset_name=$(basename "$asset")
            if [[ -n "${current_assets[$asset_name]+present}" ]]; then
              echo "duplicate release asset name: $asset_name" >&2
              exit 1
            fi
            current_assets["$asset_name"]=1
          done

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            is_draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)
            if [[ "$is_draft" != "true" ]]; then
              echo "refusing to upload assets to non-draft release $RELEASE_TAG" >&2
              exit 1
            fi

            managed_asset_pattern='^(linux|macos|windows|linux-x86_64|macos-aarch64|macos-x86_64|windows-x86_64)-(SHA256SUMS\.txt|Pakitup_.*\.(deb|AppImage|dmg|exe|msi))$'
            while IFS= read -r existing_asset; do
              if [[ "$existing_asset" =~ $managed_asset_pattern && -z "${current_assets[$existing_asset]+present}" ]]; then
                gh release delete-asset "$RELEASE_TAG" "$existing_asset" --yes
              fi
            done < <(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')

            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --draft \
              --generate-notes \
              --notes-file docs/release/release-body.md \
              --title "Pakitup $RELEASE_TAG" \
              --verify-tag
          fi
